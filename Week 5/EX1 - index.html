<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Responsive Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="container">

        <section class="sidebar">
            <h2>Sidebar</h2>
            <p>This is the sidebar section.</p>
        </section>

        <section class="content">
            <h2>Main Content</h2>
            <div class="cards">

                <div class="card">
                    <h3>Card 1</h3>
                    <p>Responsive Design using Flexbox.</p>
                </div>

                <div class="card">
                    <h3>Card 2</h3>
                    <p>Grid Layout for page structure.</p>
                </div>

                <div class="card">
                    <h3>Card 3</h3>
                    <p>Mobile-friendly layout.</p>
                </div>

                <div class="card">
                    <h3>Card 4</h3>
                    <p>Clean and modern UI.</p>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Responsive Website</p>
    </footer>

</body>
</html>
